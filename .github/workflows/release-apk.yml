name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Test Chand APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare debug keystore
        run: |
          if [ ! -s debug.keystore ] && [ -s debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore || rm -f debug.keystore
          fi
          if [ ! -s debug.keystore ]; then
            keytool -genkeypair -noprompt \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run unit & Robolectric tests
        run: gradle :app:testDebugUnitTest

      - name: Check if release signing secrets are configured
        id: check_signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "has_release_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_release_key=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode release keystore
        if: steps.check_signing.outputs.has_release_key == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > my-upload-key.jks

      - name: Build signed Release APK
        if: steps.check_signing.outputs.has_release_key == 'true'
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle :app:assembleRelease
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/Chand-release.apk

      - name: Build Debug APK (fallback when no release keystore secret is set)
        if: steps.check_signing.outputs.has_release_key != 'true'
        run: |
          gradle :app:assembleDebug
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Chand-debug.apk

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: chand-apk
          path: dist/*.apk
          retention-days: 30

      - name: Publish GitHub Release on version tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
