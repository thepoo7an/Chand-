name: Build & Release Android APKs

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release Chand?! APKs (Universal, arm64-v8a, armeabi-v7a)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare debug keystore
        run: |
          if [ ! -s debug.keystore ] && [ -s debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore || rm -f debug.keystore
          fi
          if [ ! -s debug.keystore ]; then
            keytool -genkeypair -noprompt \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run unit & Robolectric tests
        run: gradle :app:testDebugUnitTest

      - name: Prepare release signing configuration
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KEYSTORE_FILE="${{ github.workspace }}/my-upload-key.jks"
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$SECRET_STORE_PASSWORD" ] && [ -n "$SECRET_KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$KEYSTORE_FILE"
            keytool -list -keystore "$KEYSTORE_FILE" -storepass "$SECRET_STORE_PASSWORD" -alias upload >/dev/null
            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$SECRET_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$SECRET_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "RELEASE_SIGNING_READY=true" >> "$GITHUB_ENV"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "::error::Release signing secrets (KEYSTORE_BASE64, STORE_PASSWORD, KEY_PASSWORD) are missing. Refusing to publish a tagged release with an ephemeral key."
            exit 1
          else
            echo "::warning::Release signing secrets are not configured. Building with a verification-only ephemeral key and skipping GitHub Release publishing so existing users are not locked out of updates."
            EPHEMERAL_PASS="chand-ci-verify-only"
            keytool -genkeypair -noprompt \
              -keystore "$KEYSTORE_FILE" \
              -storepass "$EPHEMERAL_PASS" \
              -alias upload \
              -keypass "$EPHEMERAL_PASS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 30 \
              -dname "CN=Chand CI Verify,O=Chand,C=US"
            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$EPHEMERAL_PASS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$EPHEMERAL_PASS" >> "$GITHUB_ENV"
            echo "RELEASE_SIGNING_READY=false" >> "$GITHUB_ENV"
            {
              echo "### Signing Secrets Not Configured"
              echo "APKs were compiled for CI verification only and **not** published to GitHub Releases."
              echo "Add \`KEYSTORE_BASE64\`, \`STORE_PASSWORD\`, and \`KEY_PASSWORD\` (key alias: \`upload\`) under **Settings → Secrets and variables → Actions** to publish updatable Releases."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Compute automatic app version
        run: |
          VERSION_CODE="${{ github.run_number }}"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            RAW_TAG="${{ github.ref_name }}"
            VERSION_NAME="${RAW_TAG#v}"
          else
            VERSION_NAME="1.0.${{ github.run_number }}"
          fi
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "Resolved version: $VERSION_NAME ($VERSION_CODE)"

      - name: Build Universal, arm64-v8a & armeabi-v7a Release APKs
        run: |
          gradle :app:assembleRelease -PenableAbiSplits=true
          mkdir -p dist
          cp app/build/outputs/apk/release/app-universal-release.apk dist/Chand-universal-release.apk
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk dist/Chand-arm64-v8a-release.apk
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk dist/Chand-armeabi-v7a-release.apk
          ls -lh dist/

      - name: Upload Release APKs artifact
        uses: actions/upload-artifact@v4
        with:
          name: chand-release-apks
          path: dist/*.apk
          retention-days: 30

      - name: Publish all 3 APKs to GitHub Release
        if: env.RELEASE_SIGNING_READY == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          name: Chand?! v${{ env.VERSION_NAME }} (Build ${{ env.VERSION_CODE }})
          files: |
            dist/Chand-universal-release.apk
            dist/Chand-arm64-v8a-release.apk
            dist/Chand-armeabi-v7a-release.apk
          generate_release_notes: true
